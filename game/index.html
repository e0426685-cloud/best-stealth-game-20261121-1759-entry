<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SHADOW VAULT — a top-down stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #1a1d24; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="SHADOW VAULT: a top-down stealth game. Move with WASD or arrow keys, hold Shift to sneak, collect all intel, then reach the exit unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
